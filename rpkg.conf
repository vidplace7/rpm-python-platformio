# COPR builds this repo from GitHub, and generates an rpkg config whose
# lookaside download_url is templated off the git remote's hostname:
#   https://${git_props:remote_netloc}/repo/pkgs/%(repo_path)s/...
# github.com has no lookaside cache, so fetching the tarballs listed in
# `sources` 404s.  rpkg-util reads <git-root>/rpkg.conf last, so this
# overrides COPR's generated ~/.config/rpkg.conf and points the lookaside
# at Fedora dist-git instead.
[lookaside]
download_url = https://src.fedoraproject.org/repo/pkgs/rpms/python-platformio/%(filename)s/%(hashtype)s/%(hash)s/%(filename)s
